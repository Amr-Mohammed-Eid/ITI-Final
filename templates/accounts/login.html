{% extends "base.html" %}
{% load static %}

{% block title %}Warraq - Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{% static 'images/warraq1.png' %}" alt="Warraq Logo" class="logo">
    <h1 class="title">Warraq</h1>
    <p class="subtitle">Access the digital archives</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-submit">Login to Archives</button>
    </form>

    <p class="footer-text">
      Don't have access? <a href="{% url 'signup' %}">Request Entry</a>
    </p>
  </div>
</div>
{% endblock %}
