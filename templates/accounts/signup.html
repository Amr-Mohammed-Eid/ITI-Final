{% extends "base.html" %}
{% load static %}

{% block title %}Warraq - Sign Up{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{% static 'images/warraq1.png' %}" alt="Warraq Logo" class="logo">
    <h1 class="title">Warraq</h1>
    <p class="subtitle">Register for academic access.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <p class="footer-text">
      Already registered? <a href="{% url 'login' %}">Return to Login</a>
    </p>
  </div>
</div>
{% endblock %}
